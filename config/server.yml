# logLevel: <number>
logLevel: 2

# path: <string>
path: /var/run/mirakurun.sock

# port: <number>
# You can change this if port conflicted.
# Don't expose this port on the internet, not even with NAPT.
# Use this in LAN or VPN.
# `~` to disable TCP port listening.
port: 40772

# defaultTlvStreamFormat: <string> ("tlv" or "ts")
# What a stream API request without `format` gets for a TLV (BS4K) channel.
# "ts" converts through the tuner's `tlvToTsDecoder`.
# defaultTlvStreamFormat: tlv
