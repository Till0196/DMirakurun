services:
  mirakurun:
    build:
      context: ../
      dockerfile: docker/Dockerfile
      target: dev
    environment:
      TZ: Asia/Tokyo
      DOCKER: "YES"
      NODE_ENV: development
      DOCKER_NETWORK: host
      npm_config_cache: /tmp/.npm
      npm_config_update_notifier: "false"
    command:
      - bash
      - -c
      - |
        set -e
        [ -e node_modules/.package-lock.json ] || npm ci
        [ -d lib ] && [ -n "$(ls -A lib 2>/dev/null)" ] || npm run build
        npm run watch &
        exec node --watch-path=./lib --max-semi-space-size=64 \
          -r source-map-support/register lib/server.js
    volumes:
      - mirakurun_node_modules:/app/node_modules
      - /opt/mirakurun/config:/app-config
      - /opt/mirakurun/data:/app-data
      - /dev:/dev
    develop:
      watch:
        - action: sync
          path: ../src
          target: /app/src
        - action: sync
          path: ../bin
          target: /app/bin
        - action: sync
          path: ../docker/container-init.sh
          target: /app/docker/container-init.sh
        - action: sync+restart
          path: ../package.json
          target: /app/package.json
        - action: sync+restart
          path: ../package-lock.json
          target: /app/package-lock.json
        - action: sync+restart
          path: ../tsconfig.json
          target: /app/tsconfig.json
        - action: sync+restart
          path: ../webpack.config.js
          target: /app/webpack.config.js
        - action: rebuild
          path: ../docker/Dockerfile
    network_mode: host
    cap_add:
      - SYS_ADMIN
      - SYS_NICE
    device_cgroup_rules:
      - 'c *:* rmw'
    tmpfs:
      - /tmp
    container_name: mirakurun-dev
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-file: "1"
        max-size: 10m

volumes:
  mirakurun_node_modules:
